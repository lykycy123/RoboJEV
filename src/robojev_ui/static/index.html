<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RoboJEV 路 Console</title><link rel="stylesheet" href="/static/style.css"></head>
<body><header><a class="brand" href="#new">RoboJEV<span>鈥?/span></a><p data-i="subtitle"></p><span id="health" class="pill"></span><button id="language" class="quiet">涓枃</button></header>
<main><nav><button data-page="new" data-i="new"></button><button data-page="environment" data-i="environment"></button><button data-page="run" data-i="run"></button><button data-page="history" data-i="history"></button></nav><div id="message" role="status" hidden></div>
<section id="page-new" class="page">
 <div class="hero"><div><small>ROBOJEV / CONTROL ROOM</small><h1 data-i="headline"></h1><p data-i="intro"></p></div><div class="hero-mark">05<span data-i="fiveTasks"></span></div></div>
 <form id="experiment-form"><section class="card task-section"><div class="card-head"><small data-i="chooseTask"></small><span class="mono" data-i="taskHint"></span></div><div id="tasks" class="task-grid"></div></section>
 <div class="grid"><section class="card"><small data-i="execution"></small><h2 data-i="setup"></h2><label><span data-i="name"></span><input id="name" maxlength="100" autocomplete="off"></label>
 <div class="row"><label><span data-i="mode"></span><select id="mode"><option value="single" data-i="single"></option><option value="batch" data-i="batch"></option></select></label><label><span data-i="policy"></span><select id="policy"><option value="rule" data-i="rule"></option><option value="jev">JEV</option><option value="paired" data-i="paired"></option></select></label></div>
 <div class="row"><label><span data-i="seed"></span><input id="seed" type="number" value="1000" min="0" max="2147483647" required></label><label><span data-i="count"></span><input id="count" type="number" value="1" min="1" max="100" required></label><label><span data-i="workers"></span><input id="workers" type="number" value="1" min="1" max="4" required></label></div>
 <label class="check"><input id="capture" type="checkbox"><span data-i="capture"></span></label><p class="hint" data-i="captureHint"></p></section>
 <section class="card launch-card"><small data-i="launchLabel"></small><h2 data-i="readyTitle"></h2><div class="summary-number" id="slot-count">1</div><p id="run-summary" class="muted"></p><div id="connection-summary" class="notice"></div><p id="charge-note" class="hint" hidden data-i="charge"></p><button id="launch" type="submit" class="primary wide" data-i="launch"></button><p class="hint" data-i="browserHint"></p></section></div>
 <details class="card advanced"><summary data-i="advanced"></summary><div class="row"><label><span data-i="step"></span><input id="step" type="number" min="0.1" max="20" step="0.1" value="10" required></label><p class="hint" data-i="advancedHint"></p></div><div id="limits" class="limits"></div><button type="button" id="reset-advanced" data-i="reset"></button></details></form>
</section>
<section id="page-environment" class="page" hidden><div class="page-title"><small>ENVIRONMENT / CONNECTION</small><h1 data-i="environment"></h1><p data-i="envIntro"></p></div>
 <div class="grid"><section class="card"><small data-i="machine"></small><h2 data-i="readiness"></h2><div id="environment-report"></div><div class="actions"><button id="download-assets" data-i="downloadAssets"></button><button id="probe-renderer" data-i="probeRenderer"></button><button id="refresh-env" class="quiet" data-i="refresh"></button></div><pre id="operation-output" hidden></pre></section>
 <section class="card"><small>TYPESAFE / JEV</small><h2 data-i="connect"></h2><p id="key-status" class="notice"></p><label>API Key<input id="api-key" type="password" autocomplete="off" spellcheck="false" maxlength="4096"></label><label class="check"><input id="remember" type="checkbox"><span data-i="remember"></span></label><p class="hint" data-i="keyHint"></p><div class="actions"><button id="save-key" class="primary" data-i="saveKey"></button><button id="clear-key" class="quiet" data-i="clearKey"></button></div></section>
 <section class="card wide-card"><h2 data-i="apiSettings"></h2><div class="row"><label><span data-i="model"></span><input id="model" value="jev-1.13.0" maxlength="120"></label><label class="grow">API URL<input id="api-url" type="url" value="https://api.typesafe.ai/v1/systemone"></label><label><span data-i="timeout"></span><input id="timeout" type="number" value="25" min="1" max="300"></label><label><span data-i="retries"></span><input id="retries" type="number" value="2" min="0" max="2"></label></div><button id="test-key" data-i="testKey"></button><p class="hint" data-i="testHint"></p></section></div>
</section>
<section id="page-run" class="page" hidden><div class="page-title"><small>EXPERIMENT / OBSERVATION</small><h1 data-i="run"></h1></div><div id="run-empty" class="card" data-i="noRun"></div><div id="run-content" hidden>
 <section class="card"><div class="job-top"><h2 id="run-name"></h2><span id="run-status" class="badge"></span></div><p id="run-meta" class="mono"></p><div class="bar"><i id="run-progress"></i></div><div id="run-stats" class="stat-grid"></div><div class="actions"><button id="stop-run" class="danger" data-i="stop"></button><button id="resume-run" data-i="resume"></button><button id="copy-run" data-i="copy"></button><a id="download-report" class="button" data-i="downloadReport"></a></div><p id="run-error" class="error"></p></section>
 <div id="result-groups" class="result-groups"></div><section class="card"><small data-i="trialResults"></small><div class="table-scroll"><table><thead><tr><th data-i="task"></th><th data-i="policy"></th><th data-i="seedShort"></th><th data-i="status"></th><th data-i="decisions"></th><th data-i="outcome"></th><th data-i="video"></th></tr></thead><tbody id="trial-table"></tbody></table></div></section>
 <section class="card evidence"><div class="row"><label><span data-i="inspectTrial"></span><select id="inspect-slot"></select></label><div class="actions"><button id="generate-video" data-i="generate"></button><a id="video-download" class="button" data-i="downloadVideo" hidden></a></div></div><video id="video-player" controls preload="metadata" hidden></video><p id="video-note" class="hint"></p><h3 data-i="evidence"></h3><pre id="evidence"></pre><details><summary data-i="logs"></summary><pre id="trial-log"></pre></details><details><summary data-i="configuration"></summary><pre id="run-config"></pre></details></section></div>
</section>
<section id="page-history" class="page" hidden><div class="page-title"><small>ARCHIVE / REPRODUCE</small><h1 data-i="history"></h1><p data-i="historyHint"></p></div><div class="row filters"><label><span data-i="task"></span><select id="filter-task"></select></label><label><span data-i="policy"></span><select id="filter-policy"><option value="" data-i="all"></option><option value="rule" data-i="rule"></option><option value="jev">JEV</option><option value="paired" data-i="paired"></option></select></label><label><span data-i="status"></span><select id="filter-status"><option value="" data-i="all"></option><option value="completed" data-i="completed"></option><option value="running" data-i="running"></option><option value="cancelled" data-i="cancelled"></option><option value="interrupted" data-i="interrupted"></option><option value="error" data-i="error"></option><option value="rendering" data-i="rendering"></option></select></label></div><div id="history"></div></section>
<footer><span>RoboJEV / MuJoCo / Franka Panda</span><span data-i="footer"></span></footer></main><script src="/static/console.js"></script></body></html>
