<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title description">
  <title id="title">RoboJEV closed-loop control architecture</title>
  <desc id="description">Measured simulator state enters JEV intent selection and then JEV action selection. Validated actions pass through Cartesian IK to MuJoCo physics. Updated measurements return to the next decision. A separate physical evaluator checks task success and does not feed the policy.</desc>
  <defs>
    <linearGradient id="canvas" x2="1" y2="1"><stop stop-color="#101c2c"/><stop offset="1" stop-color="#0a101b"/></linearGradient>
    <linearGradient id="model" x2="0" y2="1"><stop stop-color="#12323e"/><stop offset="1" stop-color="#10232e"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="m2 1 6 4-6 4" fill="none" stroke="#41d2e3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="amberArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="m2 1 6 4-6 4" fill="none" stroke="#ffb244" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text{font-family:Segoe UI,Arial,sans-serif;fill:#e8f0fa}
      .eyebrow{font-size:12px;font-weight:600;letter-spacing:2px;fill:#91a9c2}
      .heading{font-size:21px;font-weight:650;letter-spacing:-.5px}
      .body{font-size:16px;fill:#b3c3d5}
      .small{font-size:13px;fill:#91a9c2}
      .cyan{fill:#41d2e3}.amber{fill:#ffb244}
      .line{fill:none;stroke:#41d2e3;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
    </style>
  </defs>
  <rect x="1" y="1" width="1198" height="558" rx="20" fill="url(#canvas)" stroke="#293a50"/>
  <path d="M36 43h22" stroke="#41d2e3" stroke-width="3" stroke-linecap="round"/>
  <text x="70" y="48" class="eyebrow cyan">ROBOJEV / CONTROL ARCHITECTURE</text>
  <text x="36" y="92" font-size="30" font-weight="650" letter-spacing="-.7">Observe. Decide. Act. Repeat.</text>
  <text x="36" y="122" class="body">Two model calls per decision. One measured physical outcome.</text>
  <rect x="959" y="34" width="205" height="30" rx="15" fill="#182839" stroke="#30455c"/>
  <circle cx="977" cy="49" r="4" fill="#41d2e3"/>
  <text x="990" y="54" class="small">STATE INPUT · NO IMAGES</text>

  <!-- Measured input -->
  <rect x="36" y="186" width="208" height="200" rx="12" fill="#152234" stroke="#34465d"/>
  <text x="54" y="214" class="eyebrow">01 / OBSERVE</text>
  <text x="54" y="250" class="heading">Measured state</text>
  <text x="54" y="280" class="body">Object + TCP poses</text>
  <text x="54" y="305" class="body">Jaw width + contacts</text>
  <text x="54" y="330" class="body">Goal geometry</text>
  <path d="M54 345h172" stroke="#34465d"/>
  <text x="54" y="368" class="small">Recent action history</text>

  <!-- Two actual model calls, enclosed as a single subsystem -->
  <rect x="272" y="160" width="376" height="226" rx="12" fill="url(#model)" stroke="#28717c"/>
  <text x="290" y="188" class="eyebrow cyan">02 / JEV · TWO-STAGE POLICY</text>
  <rect x="288" y="207" width="156" height="131" rx="8" fill="#142a37" stroke="#28515f"/>
  <text x="304" y="233" class="small cyan">CALL 1</text>
  <text x="304" y="264" class="heading">Intent</text>
  <text x="304" y="290" class="body">Choose the next</text>
  <text x="304" y="313" class="body">task objective</text>
  <rect x="478" y="207" width="154" height="131" rx="8" fill="#142a37" stroke="#28515f"/>
  <text x="494" y="233" class="small cyan">CALL 2</text>
  <text x="494" y="264" class="heading">Action</text>
  <text x="494" y="290" class="body">X / Y / Z</text>
  <text x="494" y="313" class="body">+ gripper</text>
  <path d="M446 273h27" class="line" marker-end="url(#arrow)"/>
  <text x="290" y="368" class="small">Same state + model-selected intent → action</text>

  <!-- Low-level execution -->
  <rect x="676" y="186" width="220" height="200" rx="12" fill="#152234" stroke="#34465d"/>
  <text x="694" y="214" class="eyebrow">03 / EXECUTE</text>
  <text x="694" y="250" class="heading">Cartesian control</text>
  <text x="694" y="280" class="body">Validate response</text>
  <text x="694" y="305" class="body">Check workspace</text>
  <text x="694" y="330" class="body">Jacobian IK → joints</text>
  <path d="M694 345h184" stroke="#34465d"/>
  <text x="694" y="368" class="small">10 / 4 mm step · fixed orientation</text>

  <!-- Physics -->
  <rect x="924" y="186" width="240" height="200" rx="12" fill="#152234" stroke="#34465d"/>
  <text x="942" y="214" class="eyebrow">04 / SIMULATE</text>
  <text x="942" y="250" class="heading">MuJoCo physics</text>
  <text x="942" y="280" class="body">Franka Panda + objects</text>
  <text x="942" y="305" class="body">Contact + friction</text>
  <text x="942" y="330" class="body">Measured motion</text>
  <path d="M942 345h204" stroke="#34465d"/>
  <text x="942" y="368" class="small">2 ms physics timestep</text>

  <path d="M246 273h22" class="line" marker-end="url(#arrow)"/>
  <path d="M650 273h22" class="line" marker-end="url(#arrow)"/>
  <path d="M898 273h22" class="line" marker-end="url(#arrow)"/>

  <!-- Separate lanes for measurement feedback and outcome evaluation -->
  <path d="M1020 386v48H140v-44" class="line" stroke-dasharray="5 5" opacity=".8" marker-end="url(#arrow)"/>
  <rect x="332" y="420" width="334" height="28" rx="14" fill="#10212e"/>
  <text x="499" y="439" text-anchor="middle" class="small cyan">Updated measurements → next decision</text>
  <path d="M1136 386v88" fill="none" stroke="#ffb244" stroke-width="2" marker-end="url(#amberArrow)"/>
  <rect x="748" y="478" width="416" height="54" rx="9" fill="#26251f" stroke="#76603b"/>
  <circle cx="770" cy="505" r="8" fill="none" stroke="#ffb244" stroke-width="1.5"/>
  <path d="m766 505 3 3 5-6" fill="none" stroke="#ffb244" stroke-width="1.5"/>
  <text x="789" y="501" font-size="15" font-weight="600" class="amber">Independent task evaluator</text>
  <text x="789" y="521" class="small">Physical success checks · never fed to the policy</text>
  <text x="36" y="500" class="small">Invalid response → no action</text>
  <text x="36" y="523" class="small">Simulation pauses while awaiting JEV</text>
</svg>
